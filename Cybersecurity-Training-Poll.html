<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Training Poll</title>
  <link rel="stylesheet" href="Cybersecurity-Training-Poll.css" />
</head>

<body>
  <main class="poll">
    <h1>We are launching a foundational cybersecurity training track focused on conceptual strategy, adversary tactics,
      and vulnerability analysis.</h1>
    <p>Which core module should we break down first?</p>
    <form id="pollForm">
      <div class="options">
        <label>
          <input type="radio" name="module"
            value="Active &amp; Passive Reconnaissance: Comprehensive footprinting and OSINT strategies used to map target infrastructure" />
          Active &amp; Passive Reconnaissance: Comprehensive footprinting and OSINT strategies used to map target
          infrastructure
        </label>
        <label>
          <input type="radio" name="module"
            value="Web Application Flaws: Analyzing critical vulnerabilities (e.g., Broken Access Control, Injections) and their architectural impact." />
          Web Application Flaws: Analyzing critical vulnerabilities (e.g., Broken Access Control, Injections) and their
          architectural impact.
        </label>
        <label>
          <input type="radio" name="module"
            value="Adversary Tactics &amp; Persistence: Demystifying the hacker mindset through real-world vectors (e.g., PAM backdoors, SSH backdoors, APT groups)." />
          Adversary Tactics &amp; Persistence: Demystifying the hacker mindset through real-world vectors (e.g., PAM
          backdoors, SSH backdoors, APT groups).
        </label>
        <label>
          <input type="radio" name="module" value="I am ready to learn the fundamentals, just drop the schedule!" />
          I am ready to learn the fundamentals, just drop the schedule!
        </label>
      </div>
      <button type="submit">Submit vote</button>
      <div id="result" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("pollForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const selected = form.querySelector('input[name="module"]:checked');
      result.textContent = selected
        ? `Thanks! You selected: ${selected.value}`
        : "Please select an option before submitting.";
    });
  </script>
</body>

</html>
