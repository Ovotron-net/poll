    <canvas id="quantumCanvas"></canvas>

    <script>
        const canvas = document.getElementById("quantumCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);


        let nodes = [];
        const numNodes = 120;
        const fov = 250;

        for (let i = 0; i < numNodes; i++) {
            nodes.push({
                x: (Math.random() - 0.5) * 400,
                y: (Math.random() - 0.5) * 400,
                z: (Math.random() - 0.5) * 400,
                color: `hsl(${Math.random() * 40 + 320}, 100%, 60%)`
            });
        }

        let angleX = 0.005;
        let angleY = 0.008;

        function rotateX(node, angle) {
            let cos = Math.cos(angle);
            let sin = Math.sin(angle);
            let y1 = node.y * cos - node.z * sin;
            let z1 = node.z * cos + node.y * sin;
            node.y = y1;
            node.z = z1;
        }

        function rotateY(node, angle) {
            let cos = Math.cos(angle);
            let sin = Math.sin(angle);
            let x1 = node.x * cos - node.z * sin;
            let z1 = node.z * cos + node.x * sin;
            node.x = x1;
            node.z = z1;
        }

        function animate() {
            ctx.fillStyle = "rgba(1, 1, 5, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            nodes.forEach(node => {
                rotateX(node, angleX);
                rotateY(node, angleY);


                let scale = fov / (fov + node.z);
                node.screenX = cx + node.x * scale;
                node.screenY = cy + node.y * scale;
                node.screenSize = Math.max(0.1, scale * 3);
            });

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let n1 = nodes[i];
                    let n2 = nodes[j];


                    let dist = Math.hypot(n1.x - n2.x, n1.y - n2.y, n1.z - n2.z);

                    if (dist < 90) {
                        ctx.beginPath();
                        ctx.strokeStyle = n1.color;
                        ctx.globalAlpha = (1 - dist / 90) * 0.4;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(n1.screenX, n1.screenY);
                        ctx.lineTo(n2.screenX, n2.screenY);
                        ctx.stroke();
                    }
                }
            }

            nodes.forEach(node => {
                ctx.beginPath();
                ctx.fillStyle = node.color;
                ctx.globalAlpha = 1;
                ctx.arc(node.screenX, node.screenY, node.screenSize, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener("touchmove", (e) => {
            angleX = (e.touches[0].clientY / window.innerHeight - 0.5) * 0.05;
            angleY = (e.touches[0].clientX / window.innerWidth - 0.5) * 0.05;
        });

        animate();
    </script>
